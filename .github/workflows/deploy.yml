name: Deploy

# Builds the portal image on every push to main and, once the server exists, rolls it out.
# Off until the repository variable DEPLOY_ENABLED is "true". The device setup address comes
# from the repository variables VITE_ADMS_SERVER and VITE_ADMS_PORT.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PORTAL_IMAGE: ghcr.io/${{ github.repository_owner }}/najah_portal

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          docker build \
            --build-arg VITE_ADMS_SERVER="${{ vars.VITE_ADMS_SERVER }}" \
            --build-arg VITE_ADMS_PORT="${{ vars.VITE_ADMS_PORT || '8081' }}" \
            -t "$PORTAL_IMAGE:${GITHUB_SHA}" -t "$PORTAL_IMAGE:latest" .
          docker push --all-tags "$PORTAL_IMAGE"

  deploy:
    needs: image
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Roll out
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          ssh "$TARGET" "cd /opt/najah && \
            sed -i 's#^PORTAL_IMAGE=.*#PORTAL_IMAGE=$PORTAL_IMAGE:${GITHUB_SHA}#' .env && \
            docker compose --env-file .env -f docker-compose.yml pull portal && \
            docker compose --env-file .env -f docker-compose.yml up -d --wait portal && \
            docker image prune -f"
